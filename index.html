<!doctype html>
<html lang="en">

    <!-- Primary Meta Tags — fallback shell only. Every tag below that
         react-helmet-async also manages on mounted pages carries data-rh="true"
         so Helmet's hydration takes over cleanly instead of leaving a stale
         duplicate (e.g. two conflicting <link rel="canonical"> tags). -->
    <title>Zyllo Tech | Software Development Company India | Web, Mobile, AI &amp; Cloud</title>
    <meta name="description" content="Zyllo Tech is a software engineering company in  India delivering web &amp; mobile apps, AI/ML solutions, cloud DevOps, cybersecurity, and QA for enterprises across India, USA, UAE, UK, and globally." data-rh="true">

    <meta name="author" content="Zyllo Tech" data-rh="true" />
    <meta name="google-site-verification" content="_6xwMfBmkqmAt9Kzgu2CqZhANVGls8loK8h1da-FPec" />

    <meta name="theme-color" content="#f97316" data-rh="true" />
    <link rel="canonical" href="https://zyllotech.com/" data-rh="true" />

    <!-- PWA Manifest -->

    <!-- Open Graph -->

    <meta property="og:site_name" content="Zyllo Tech" data-rh="true" />


    <meta property="og:url" content="https://zyllotech.com/" data-rh="true" />
    <meta property="og:image" content="https://storage.googleapis.com/gpt-engineer-file-uploads/KCdCgzQqlrUlZx0GJf8ZTPlKH1p2/social-images/social-1772909865329-Zyllo_Tech_-_PNG_Logo_Icon.webp" data-rh="true">

         React renders — the shell HTML contains no <img>. Preloading lets the
         browser fetch it in parallel with the JS bundles. -->
