<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags — fallback shell only. Every tag below that
         react-helmet-async also manages on mounted pages carries data-rh="true"
         so Helmet's hydration takes over cleanly instead of leaving a stale
         duplicate (e.g. two conflicting <link rel="canonical"> tags). -->
    <title>Zyllo Tech | Custom Software Development for US, EU &amp; Global Clients</title>
    <meta name="description" content="Senior engineering teams, weekly demos, code you own from day one, US/EU timezone overlap, India economics. Custom web, mobile, AI &amp; cloud software." data-rh="true">
    <meta name="keywords" content="custom software development company, offshore software development company, dedicated development team, hire dedicated developers, web development company, mobile app development company, AI development company, software development company India, software company Hyderabad" data-rh="true" />
    <meta name="author" content="Zyllo Tech" data-rh="true" />
    <meta name="google-site-verification" content="_6xwMfBmkqmAt9Kzgu2CqZhANVGls8loK8h1da-FPec" />
    <meta name="robots" content="index,follow,max-snippet:-1,max-image-preview:large,max-video-preview:-1" data-rh="true" />
    <meta name="theme-color" content="#f97316" data-rh="true" />
    <link rel="canonical" href="https://zyllotech.com/" data-rh="true" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" data-rh="true" />
    <meta name="mobile-web-app-capable" content="yes" data-rh="true" />
    <meta name="apple-mobile-web-app-capable" content="yes" data-rh="true" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" data-rh="true" />
    <meta name="apple-mobile-web-app-title" content="Zyllo Tech" data-rh="true" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" data-rh="true" />
    <meta property="og:site_name" content="Zyllo Tech" data-rh="true" />


    <meta property="og:url" content="https://zyllotech.com/" data-rh="true" />
    <meta property="og:image" content="https://zyllotech.com/og-default.png" data-rh="true">
    <meta property="og:image:width" content="1200" data-rh="true" />
    <meta property="og:image:height" content="630" data-rh="true" />
    <meta property="og:locale" content="en_IN" data-rh="true" />
    <meta property="og:locale:alternate" content="en_US" data-rh="true" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" data-rh="true" />
    <meta name="twitter:site" content="@ZylloS85154" data-rh="true" />
    <meta name="twitter:creator" content="@ZylloS85154" data-rh="true" />


    <meta name="twitter:image" content="https://zyllotech.com/og-default.png" data-rh="true">

    <!-- Geo targeting — India-first, global reach (India + USA primary) -->
    <meta name="geo.region" content="IN-TG" data-rh="true" />
    <meta name="geo.placename" content="Hyderabad, India" data-rh="true" />
    <meta name="geo.position" content="17.3850;78.4867" data-rh="true" />
    <meta name="ICBM" content="17.3850, 78.4867" data-rh="true" />
    <meta name="language" content="English" data-rh="true" />
    <meta name="distribution" content="global" data-rh="true" />
    <meta name="rating" content="general" data-rh="true" />
    <meta name="coverage" content="Worldwide" />
    <meta name="target" content="all" />

    <!-- The LCP candidates (nav logo on mobile, first hero slide on larger
         viewports) are otherwise undiscoverable until React renders — the
         shell HTML contains no <img>. Preloading lets the browser fetch them
         in parallel with the JS bundles. -->
    <link rel="preload" as="image" href="/zyllo-logo-nav.png" fetchpriority="high" />
    <link rel="preload" as="image" href="/hero-home1.webp" fetchpriority="high" />

    <!-- Favicon -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    
  
  
  
  <meta property="og:title" content="Zyllo Tech | Custom Software Development for US, EU &amp; Global Clients" data-rh="true">
  <meta name="twitter:title" content="Zyllo Tech | Custom Software Development for US, EU &amp; Global Clients" data-rh="true">
  <meta property="og:description" content="Senior engineering teams, weekly demos, code you own from day one, US/EU timezone overlap, India economics. Custom web, mobile, AI &amp; cloud software." data-rh="true">
  <meta name="twitter:description" content="Senior engineering teams, weekly demos, code you own from day one, US/EU timezone overlap, India economics. Custom web, mobile, AI &amp; cloud software." data-rh="true">
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
